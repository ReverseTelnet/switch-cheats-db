name: Update Repo

on:
  schedule: 
    - cron:  '10 13 * * *'
  workflow_dispatch:

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v2

      - name: setup python
        uses: actions/setup-python@v2
        with:
          python-version: 3.x

      - name: install dependencies
        run: |
          if [ -f ./requirements_versions.txt ]; then pip3 install -r ./requirements_versions.txt; fi

      - name: run script
        run: |
          python3 process_versions.py

      - name: push changes
        run: |
          git config --global user.name 'HamletDuFromage'
          git config --global user.email '90281142+Homletbot@users.noreply.github.com'
          git add versions.json
          git add versions/*
          if [[ `git status --porcelain` ]]; then
            git commit -m "automatic: updated version files"
            git push
          else
            echo "Nothing to commit!"
          fi


  update-cheats:
    needs: update-versions
    runs-on: ubuntu-latest
    steps:
  
      - name: checkout repo content
        uses: actions/checkout@v2
        with:
          ref: 'runner_development'

      - name: setup python
        uses: actions/setup-python@v2
        with:
          python-version: 3.x

      - name: install python dependencies
        run: |
          if [ -f ./requirements_cheats.txt ]; then pip3 install -r ./requirements_cheats.txt; fi

      - name: update apt
        run: sudo apt-get update

      - name: install dependencies
        run: sudo apt-get install unrar libnss3 libnspr4 libxss1 libasound2t64 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libxcomposite1 libxrandr2 libxdamage1 libgbm1 libpango-1.0-0 libcairo2 libatspi2.0-0 libdrm2 libevent-core-2.1-7t64

      - name: install playwright dependencies
        run: sudo playwright install-deps

      - name: instantiate playwright
        run: playwright install chromium firefox webkit

      - name: run python script
        run: |
          python3 database_builder.py
